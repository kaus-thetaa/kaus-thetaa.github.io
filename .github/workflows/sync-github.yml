name: Sync public GitHub activity
on:
  schedule:
    - cron: '25 1 * * *'
  push:
    branches: [main]
    paths-ignore: ['data/github.json']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: github-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/sync-github.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit public snapshot and rebuild Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/github.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public GitHub activity"
            git push
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          fi
